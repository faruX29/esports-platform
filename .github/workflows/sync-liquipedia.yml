name: Sync Liquipedia (hybrid stats + transfers)

# Liquipedia rate-limit'ine saygı için GÜNLÜK (saatlik değil). Hybrid harita/KDA
# backfill + transfer senkronu. v3 API birincil, key yoksa wikitext yedek.
on:
  schedule:
    - cron: '0 5 * * *'   # her gün 05:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-liquipedia
  cancel-in-progress: false

jobs:
  transfers:
    # Transfer hattı. LLM adımı yavaş; kendi işinde izole → tıkanırsa diğerlerini etkilemez.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # continue-on-error KALDIRILDI (2026-08-28): bu adım Actions'ta sessizce
      # başarısız oluyordu (yerelde 275 transfer buluyor, Actions'ta 0 yazıyordu)
      # ve hata yutulduğu için haftalarca fark edilmedi. Artık patlarsa iş kırmızı
      # olur ve bildirim gelir — sessiz bozulmaktansa gürültülü kırılsın.
      - name: Sync transfers (v3 → roster_changes)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
        run: python run.py --sync-transfers --transfer-days 14

      - name: Apply transfers to rosters (Liquipedia → players.team_pandascore_id)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python apply_roster_changes.py --apply

      - name: Generate transfer news (LLM, bekleyen roster_changes)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
        run: python run.py --generate-transfers

      # ── Dead-man's switch (Gemini #54, 2026-08-28) ────────────────────────
      # Liquipedia hattı 8+ gün sessizce ölü kaldı. Sebep: koşular zaman
      # aşımından "cancelled" bitiyordu; GitHub'ın varsayılan hata e-postası ise
      # YALNIZCA "failure"da gider, "cancelled"da GİTMEZ. Eski "Notify on
      # failure" adımları da sadece log'a echo yapıyordu, hiçbir yere bildirim
      # gitmiyordu.
      #
      # Bu adım hem failure hem cancelled durumunda Resend ile alarm basar.
      # Alıcı iletisim@fextesports.com (Cloudflare Email Routing ile kurucunun
      # gelen kutusuna düşer) — public repo olduğu için kişisel adres yazılmadı.
      - name: "ETL alarmi (Resend)"
        if: ${{ failure() || cancelled() }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WF_NAME: ${{ github.workflow }}
          JOB_ID: "transfers"
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY secret'i tanimli degil - alarm gonderilemedi."
            exit 0
          fi
          SUBJECT="[feXt ETL Alarm] $WF_NAME / $JOB_ID -> $JOB_STATUS"
          BODY="$WF_NAME is akisinda '$JOB_ID' isi $JOB_STATUS durumuyla bitti. Loglar: $RUN_URL -- 'cancelled' genellikle is zaman asimi demektir ve sonraki adimlarin atlandigi anlamina gelir."
          jq -n --arg s "$SUBJECT" --arg b "$BODY" \
            '{from:"feXt ETL <noreply@fextesports.com>",to:["iletisim@fextesports.com"],subject:$s,text:$b}' \
            > /tmp/alert.json
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/alert.json
          echo
  content:
    # Maç önizlemesi + turnuva özeti. Transfer LLM yığınına takılmasın diye ayrı iş.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate match previews (yaklaşan S/A + B-tier büyük turnuva, 72s)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
        run: python run.py --generate-previews --preview-hours 72

      - name: Generate tournament recaps (biten tier S/A turnuva sonuç özetleri)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
        run: python run.py --generate-tournament-recaps

      # Küratör yıldız-oyuncu enrichment (Gemini hibrit strateji): en popüler ~50
      # oyuncuya kariyer/sosyal/yaş çek. Liquipedia 429'ladığı için DÜŞÜK hacim
      # (limit 5/gün) + işlenmişi atla (adapter targeted mod) → ~2 haftada liste dolar,
      # compliance'a saygılı. Geri kalan 5300+ oyuncuda veri boşsa UI zaten gizliyor.

      # ── Dead-man's switch (Gemini #54, 2026-08-28) ────────────────────────
      # Liquipedia hattı 8+ gün sessizce ölü kaldı. Sebep: koşular zaman
      # aşımından "cancelled" bitiyordu; GitHub'ın varsayılan hata e-postası ise
      # YALNIZCA "failure"da gider, "cancelled"da GİTMEZ. Eski "Notify on
      # failure" adımları da sadece log'a echo yapıyordu, hiçbir yere bildirim
      # gitmiyordu.
      #
      # Bu adım hem failure hem cancelled durumunda Resend ile alarm basar.
      # Alıcı iletisim@fextesports.com (Cloudflare Email Routing ile kurucunun
      # gelen kutusuna düşer) — public repo olduğu için kişisel adres yazılmadı.
      - name: "ETL alarmi (Resend)"
        if: ${{ failure() || cancelled() }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WF_NAME: ${{ github.workflow }}
          JOB_ID: "content"
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY secret'i tanimli degil - alarm gonderilemedi."
            exit 0
          fi
          SUBJECT="[feXt ETL Alarm] $WF_NAME / $JOB_ID -> $JOB_STATUS"
          BODY="$WF_NAME is akisinda '$JOB_ID' isi $JOB_STATUS durumuyla bitti. Loglar: $RUN_URL -- 'cancelled' genellikle is zaman asimi demektir ve sonraki adimlarin atlandigi anlamina gelir."
          jq -n --arg s "$SUBJECT" --arg b "$BODY" \
            '{from:"feXt ETL <noreply@fextesports.com>",to:["iletisim@fextesports.com"],subject:$s,text:$b}' \
            > /tmp/alert.json
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/alert.json
          echo
  enrichment:
    # Liquipedia zenginlestirme. En pahalı ve en az acil olan; kendi işinde.
    # timeout 50 -> 20 (2026-08-29): hybrid backfill devre dışı bırakılınca
    # geriye yalnızca düşük hacimli yıldız oyuncu adımı kaldı (~0 dk sürüyor).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Curated star-player enrichment (career/social/age, düşük hacim)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
          LIQUIPEDIA_PLAYER_TARGETS: "s1mple,ZywOo,NiKo,donk,m0NESY,device,ropz,sh1ro,blameF,Twistzz,broky,huNter,electronic,Ax1Le,XANTARES,woxic,Spinx,jL,frozen,degster,Faker,Chovy,Caps,Knight,Ruler,Keria,Gumayusi,Zeus,Oner,Peanut,ShowMaker,Canyon,Viper,Deft,Scout,Bin,Elk,Wei,aspas,Derke,TenZ,yay,Chronicle,Alfajer,Boaster,Less,Sacy,nAts,Zekken,cNed,Jinggg,f0rsakeN,Demon1,Zellsis,Leo,Marved,crashies"
        run: python run.py --liquipedia-enrich --liquipedia-sections players --liquipedia-limit 5

      # NOT: SEO sitemap artık dinamik Vercel Edge route (frontend/api/sitemap.js,
      # Gemini #15) — statik dosya üretimi/commit'i kaldırıldı. Sitemap istek anında
      # Supabase'den üretilir. Bu workflow'da sitemap adımı yok.

      # ⚠️ EN SONA ALINDI (2026-08-25). Bu adım 25 dakikalık iş zaman aşımını tek
      # başına tüketiyordu → job "cancelled" oluyor ve ARDINDAKİ TÜM ADIMLAR
      # (transfer sync, transfer haberi, maç önizlemesi, turnuva özeti, yıldız
      # oyuncu) "skipped" geçiyordu. 8+ gündür Liquipedia hattı tamamen ölüydü;
      # roster_changes 3 Temmuz'dan beri boştu. Sona alınınca zaman aşımına
      # uğrasa bile diğer her şey tamamlanmış olur.

      # ⛔ DEVRE DIŞI (2026-08-29, lansman öncesi). İki gerekçe:
      #
      # 1) HİÇBİR ŞEY ÜRETMİYOR. player_match_stats tablosuna son 14 günde
      #    SIFIR satır yazıldı. Adım her gün 50 dakikalık iş zaman aşımını
      #    baştan sona tüketiyor ve tek maç bile işleyemiyor.
      #
      # 2) LIQUIPEDIA YÜKÜMLÜLÜĞÜ RİSKİ. Adım v3 API'ye değil eski
      #    liquipedia.net/<wiki>/api.php hattına düşüyor (cargoquery/wikitext
      #    fallback) ve oradan %100 HTTP 429 alıyor. 1-2 saniyelik aralıkla
      #    50 dakika boyunca 429 duvarına yeniden deneme yapmak, "doğru API
      #    kullanımı" yükümlülüğümüzü ihlal eder ve API key'imizi riske atar.
      #    Key askıya alınırsa ÇALIŞAN transfer hattı da ölür.
      #
      # Ayrıca bu adım her gün "cancelled" üretip dead-man's switch alarmını
      # (Gemini #54) sahte alarma boğuyordu — güvenilmez alarm, alarmsızlıktan
      # kötüdür.
      #
      # AÇMADAN ÖNCE YAPILACAK: adapter'ı v3'e (get_match_maps_v3_by_teams)
      # zorla, legacy api.php fallback'ini kapat. Sonra repo'da
      # Settings > Variables > HYBRID_STATS_ENABLED = true yap.
      - name: Hybrid stats backfill (map + player KDA → player_match_stats)
        if: ${{ vars.HYBRID_STATS_ENABLED == 'true' }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
        run: python run.py --hybrid-stats --hybrid-limit 50

      # ── Dead-man's switch (Gemini #54, 2026-08-28) ────────────────────────
      # Liquipedia hattı 8+ gün sessizce ölü kaldı. Sebep: koşular zaman
      # aşımından "cancelled" bitiyordu; GitHub'ın varsayılan hata e-postası ise
      # YALNIZCA "failure"da gider, "cancelled"da GİTMEZ. Eski "Notify on
      # failure" adımları da sadece log'a echo yapıyordu, hiçbir yere bildirim
      # gitmiyordu.
      #
      # Bu adım hem failure hem cancelled durumunda Resend ile alarm basar.
      # Alıcı iletisim@fextesports.com (Cloudflare Email Routing ile kurucunun
      # gelen kutusuna düşer) — public repo olduğu için kişisel adres yazılmadı.
      - name: "ETL alarmi (Resend)"
        if: ${{ failure() || cancelled() }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WF_NAME: ${{ github.workflow }}
          JOB_ID: "enrichment"
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY secret'i tanimli degil - alarm gonderilemedi."
            exit 0
          fi
          SUBJECT="[feXt ETL Alarm] $WF_NAME / $JOB_ID -> $JOB_STATUS"
          BODY="$WF_NAME is akisinda '$JOB_ID' isi $JOB_STATUS durumuyla bitti. Loglar: $RUN_URL -- 'cancelled' genellikle is zaman asimi demektir ve sonraki adimlarin atlandigi anlamina gelir."
          jq -n --arg s "$SUBJECT" --arg b "$BODY" \
            '{from:"feXt ETL <noreply@fextesports.com>",to:["iletisim@fextesports.com"],subject:$s,text:$b}' \
            > /tmp/alert.json
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/alert.json
          echo
