name: Haftalik icerik (Turk takimlari + Fextopus'u yaniltanlar)

# Pazartesi sabahi, ONCEKI haftanin (Pzt-Paz, TSI) iki haftalik haberini yazar,
# ayni haberlerin mac listesinden iki dikey video uretir ve e-posta ile yollar.
# Video listesi haberin ekler alanindan okunur: sayfa ile video ayni maclari gosterir.
on:
  schedule:
    # 07:00 TSI. GitHub gecikmesi saatlerce surebilir; hafta hesabi Pazartesi
    # icinde ayni sonucu verdigi icin gecikme tarihi bozmaz.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      hafta:
        description: 'Haftanin Pazartesi gunu (YYYY-AA-GG). Bos birakilirsa onceki hafta.'
        required: false
        type: string

concurrency:
  group: weekly-content
  cancel-in-progress: false

jobs:
  haftalik:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            social/requirements.txt

      - name: Bagimliliklar
        timeout-minutes: 5
        run: pip install -r backend/requirements.txt -r social/requirements.txt

      - name: Haftayi belirle
        timeout-minutes: 2
        id: hafta
        # haftalik.py ve weekly_news.py ile ayni kural: TSI bugununden onceki haftanin Pazartesi'si.
        run: |
          HAFTA="${{ inputs.hafta }}"
          if [ -z "$HAFTA" ]; then
            HAFTA=$(python -c "from datetime import *; t=datetime.now(timezone(timedelta(hours=3))).date(); print(t-timedelta(days=t.weekday()+7))")
          fi
          echo "hafta=$HAFTA" >> "$GITHUB_OUTPUT"
          echo "Hedef hafta: $HAFTA"

      # Tekrar calistirilabilir: o haftanin haberi varsa atlanir (ekler->>'hafta').
      - name: Haftalik haberleri yaz (LLM)
        timeout-minutes: 10
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run.py --generate-weekly --hafta "${{ steps.hafta.outputs.hafta }}"

      # Haber adimi patlasa da video/mail adimlari kosar: mail "video yok" der,
      # is kirmizi biter ve alarm gider.
      - name: Videolari uret
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        working-directory: social
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python haftalik.py "${{ steps.hafta.outputs.hafta }}"

      - name: Uretilenleri listele
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        id: liste
        working-directory: social
        run: |
          if ls cikti/*.mp4 >/dev/null 2>&1; then
            ls -la cikti
            echo "var=true" >> "$GITHUB_OUTPUT"
          else
            echo "var=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Artifact olarak yukle (yedek)
        if: ${{ !cancelled() && steps.liste.outputs.var == 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: haftalik-${{ github.run_id }}
          path: social/cikti/*.mp4
          retention-days: 14

      - name: E-posta ile gonder
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        working-directory: social
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_KONU: 'haftalik ozet'
          MAIL_BOS_NOT: 'haftalik haber yok (Turk maci yok ya da haber adimi basarisiz), video uretilmedi.'
        run: python gonder.py cikti "${{ steps.hafta.outputs.hafta }}"

      - name: "ETL alarmi (Resend)"
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 2
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WF_NAME: ${{ github.workflow }}
          JOB_ID: "haftalik"
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY secret'i tanimli degil - alarm gonderilemedi."
            exit 0
          fi
          SUBJECT="[feXt ETL Alarm] $WF_NAME / $JOB_ID -> $JOB_STATUS"
          BODY="$WF_NAME is akisinda '$JOB_ID' isi $JOB_STATUS durumuyla bitti. Loglar: $RUN_URL"
          jq -n --arg s "$SUBJECT" --arg b "$BODY" \
            '{from:"feXt ETL <noreply@fextesports.com>",to:["iletisim@fextesports.com"],subject:$s,text:$b}' \
            > /tmp/alert.json
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" -d @/tmp/alert.json
          echo
