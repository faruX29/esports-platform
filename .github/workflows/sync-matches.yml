name: Sync Esports Matches

on:
  schedule:
    # Her saat başı çalış
    - cron: '0 * * * *'

  # Manuel çalıştırma seçeneği
  workflow_dispatch:
    inputs:
      force_rosters:
        description: 'Tüm kadroları yeniden çek (force)'
        required: false
        default: 'false'
        type: boolean

# Concurrency: Aynı anda sadece 1 çalışsın
concurrency:
  group: sync-matches
  cancel-in-progress: false

jobs:
  match-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate backend path
        run: |
          test -d .
          test -f run.py
          test -f requirements.txt

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate config import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -c "from config import Config; print('✅ Config OK')"

      - name: Sync matches + predict + extract stats
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # --limit 100 = PandaScore sayfa üst sınırı. 50'de kalınca 7 günlük pencerede
        # CS2 (152 maç) ve LoL (93) kırpılıyordu → maçlar ancak zamanla listenin
        # başına kaydıkça giriyordu. 100 bu gecikmeyi büyük ölçüde kapatır.
        run: python run.py --all-games --limit 100 --predict --stats

      - name: Generate AI news articles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run.py --generate-news --news-hours 2

      - name: Notify on failure
        if: failure()
        run: echo "❌ Match sync failed! Check logs above for the exact error."

  roster-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate backend path
        run: |
          test -d .
          test -f run.py
          test -f requirements.txt

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate config import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -c "from config import Config; print('✅ Config OK')"

      - name: Sync active player rosters (incremental, son 90 gün)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Bu iş SAATLİK çalışıyor. force'suz mod yalnızca HİÇ oyuncusu olmayan
        # takımları çeker → kadrosu bir kez yüklenen takım bir daha asla
        # tazelenmiyordu ve "kadro dışı oyuncuyu serbest bırak" (flush) mantığı
        # hiç devreye girmiyordu. Sonuç: FUT/BBL gibi takımlarda 6 ay bayat,
        # ayrılmış oyuncuları da içeren şişkin kadrolar.
        #
        # Çözüm: saatlik turlarda ucuz "eksik kadro" taraması sürsün; günde BİR
        # KEZ (03:00 UTC) son 7 günde maçı olan takımlar için tam tazeleme yap.
        # Böylece sitede görünen her takım en geç 24 saatte güncellenir ve
        # PandaScore istek bütçesi saatlik force ile patlamaz.
        run: |
          if [ "${{ github.event.inputs.force_rosters }}" = "true" ] || [ "$(date -u +%H)" = "03" ]; then
            echo "🔄 Günlük tam kadro tazeleme (son 7 gün, force)"
            python run.py --players --roster-days 7 --roster-force
          else
            echo "➕ Eksik kadro taraması (force yok)"
            python run.py --players --roster-days 90
          fi

      - name: Notify on failure
        if: failure()
        run: echo "❌ Roster sync failed! Check logs above for the exact error."
