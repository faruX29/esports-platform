name: Gunluk saglik raporu

# Canli skor (pg_cron), mac/tahmin/haber tazeligi, tarayici hatalari, veritabani
# boyutu, sync-matches ve haftalik yedek kontrol edilir (backend/isletim/saglik.py).
# Esik asilirsa her gun "SORUN" e-postasi; sorun yoksa yalniz Pazartesi "her sey yolunda".
# Rapor govdesi yalniz e-postada: repo PUBLIC, bu log herkese acik.
on:
  schedule:
    # 08:00 TSI. GitHub gecikmesi saatleri bulabilir; rapor zamani govdede yazar.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      her_zaman:
        description: 'Sorun olmasa da e-posta gonder'
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: saglik
  cancel-in-progress: false

jobs:
  saglik:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Bagimliliklar
        timeout-minutes: 4
        run: pip install -r requirements.txt

      - name: Saglik raporu
        timeout-minutes: 4
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python isletim/saglik.py ${{ inputs.her_zaman && '--her-zaman' || '' }}

      # Raporun kendisi patlarsa (DB'ye baglanamadi vb.) sessiz kalmaz.
      - name: "ETL alarmi (Resend)"
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 2
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WF_NAME: ${{ github.workflow }}
          JOB_ID: "saglik"
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY secret'i tanimli degil - alarm gonderilemedi."
            exit 0
          fi
          SUBJECT="[feXt ETL Alarm] $WF_NAME / $JOB_ID -> $JOB_STATUS"
          BODY="$WF_NAME is akisinda '$JOB_ID' isi $JOB_STATUS durumuyla bitti (saglik raporu uretilemedi). Loglar: $RUN_URL"
          jq -n --arg s "$SUBJECT" --arg b "$BODY" \
            '{from:"feXt ETL <noreply@fextesports.com>",to:["iletisim@fextesports.com"],subject:$s,text:$b}' \
            > /tmp/alert.json
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" -d @/tmp/alert.json
          echo
