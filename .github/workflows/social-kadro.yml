name: Kadro videosu (Turk takimi, sabah)

# Yeni Turk takimi transfer haberlerinden Reels (social/kadro.py) uretir; video varsa
# e-posta ile yollar, yoksa e-posta yok. 3 Kas'a kadar radar isinin icindeydi; ayni
# anda iki video paylasmak birbirini kesiyordu, kadro videosu sabaha ayrildi.
# Haber ekler.reels ile isaretlenir: gecikme ya da atlanan gun tekrar/kacirma yaratmaz.
on:
  # ASIL TETIK pg_cron (backend/sql/sosyal_tetik.sql): 09:00 TSI'de workflow_dispatch.
  # Asagidaki schedule YEDEK: son 12 saatte dispatch kosusu varsa kontrol isi atlar.
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: social-kadro
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      calistir: ${{ steps.k.outputs.calistir }}
    steps:
      - id: k
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CALISTIR=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SON=$(gh run list -R "${{ github.repository }}" --workflow social-kadro.yml \
                    --event workflow_dispatch --limit 1 --json createdAt -q '.[0].createdAt // ""')
            if [ -n "$SON" ] && [ $(( $(date -u +%s) - $(date -u -d "$SON" +%s) )) -lt 43200 ]; then
              echo "Son 12 saatte dispatch kosusu var ($SON) - yedek kosu atlandi."
              CALISTIR=false
            fi
          fi
          echo "calistir=$CALISTIR" >> "$GITHUB_OUTPUT"

  kadro:
    needs: kontrol
    if: needs.kontrol.outputs.calistir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: social

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: social/requirements.txt

      - name: Bagimliliklar
        timeout-minutes: 5
        run: pip install -r requirements.txt

      # Olculdu (yerel): video basina ~20 sn.
      - name: Kadro videolari
        timeout-minutes: 5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python kadro.py

      - name: Uretilenleri listele
        timeout-minutes: 2
        id: liste
        run: |
          if ls cikti/*.mp4 >/dev/null 2>&1; then
            ls -la cikti
            echo "var=true" >> "$GITHUB_OUTPUT"
          else
            echo "Yeni Turk takimi kadro haberi yok - video uretilmedi."
            echo "var=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Artifact olarak yukle (yedek)
        if: steps.liste.outputs.var == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kadro-${{ github.run_id }}
          path: social/cikti/*.mp4
          retention-days: 14

      - name: E-posta ile gonder
        if: steps.liste.outputs.var == 'true'
        timeout-minutes: 5
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_KONU: 'kadro videosu'
        run: python gonder.py cikti "$(TZ=Europe/Istanbul date +%F)"

      - name: "ETL alarmi (Resend)"
        if: ${{ failure() || cancelled() }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WF_NAME: ${{ github.workflow }}
          JOB_ID: "kadro"
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY secret'i tanimli degil - alarm gonderilemedi."
            exit 0
          fi
          SUBJECT="[feXt ETL Alarm] $WF_NAME / $JOB_ID -> $JOB_STATUS"
          BODY="$WF_NAME is akisinda '$JOB_ID' isi $JOB_STATUS durumuyla bitti. Loglar: $RUN_URL"
          jq -n --arg s "$SUBJECT" --arg b "$BODY" \
            '{from:"feXt ETL <noreply@fextesports.com>",to:["iletisim@fextesports.com"],subject:$s,text:$b}' \
            > /tmp/alert.json
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" -d @/tmp/alert.json
          echo
