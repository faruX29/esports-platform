name: Sync Live Matches (5-min)

on:
  schedule:
    # Her 5 dakikada bir — canlı maçları anında DB'ye yansıt
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-live
  cancel-in-progress: true   # Önceki çalışma bitmemişse iptal et, yenisini başlat

jobs:
  live-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4       # 5 dakikalık window içinde bitsin
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync running matches + resolve finished (all games)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run.py --live --all-games --limit 20 --fix-orphans

      # ── Dead-man's switch (Gemini #54, 2026-08-28) ────────────────────────
      # Liquipedia hattı 8+ gün sessizce ölü kaldı. Sebep: koşular zaman
      # aşımından "cancelled" bitiyordu; GitHub'ın varsayılan hata e-postası ise
      # YALNIZCA "failure"da gider, "cancelled"da GİTMEZ. Eski "Notify on
      # failure" adımları da sadece log'a echo yapıyordu, hiçbir yere bildirim
      # gitmiyordu.
      #
      # Bu adım hem failure hem cancelled durumunda Resend ile alarm basar.
      # Alıcı iletisim@fextesports.com (Cloudflare Email Routing ile kurucunun
      # gelen kutusuna düşer) — public repo olduğu için kişisel adres yazılmadı.
      - name: "ETL alarmi (Resend)"
        # DİKKAT: bu iş akışı 5 dakikada bir çalışıyor ve concurrency
        # cancel-in-progress:true — yani önceki koşunun iptal edilmesi TASARIM
        # GEREĞİ. O yüzden burada YALNIZCA failure() dinlenir; cancelled()
        # eklenirse her yoğun dakikada alarm spam'i olur.
        if: ${{ failure() }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WF_NAME: ${{ github.workflow }}
          JOB_ID: "live-sync"
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY secret'i tanimli degil - alarm gonderilemedi."
            exit 0
          fi
          SUBJECT="[feXt ETL Alarm] $WF_NAME / $JOB_ID -> $JOB_STATUS"
          BODY="$WF_NAME is akisinda '$JOB_ID' isi $JOB_STATUS durumuyla bitti. Loglar: $RUN_URL -- 'cancelled' genellikle is zaman asimi demektir ve sonraki adimlarin atlandigi anlamina gelir."
          jq -n --arg s "$SUBJECT" --arg b "$BODY" \
            '{from:"feXt ETL <noreply@fextesports.com>",to:["iletisim@fextesports.com"],subject:$s,text:$b}' \
            > /tmp/alert.json
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/alert.json
          echo
