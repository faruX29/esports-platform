name: Sync Esports Matches

on:
  schedule:
    # Her saat başı çalış
    - cron: '0 * * * *'

  # Manuel çalıştırma seçeneği
  workflow_dispatch:
    inputs:
      force_rosters:
        description: 'Tüm kadroları yeniden çek (force)'
        required: false
        default: 'false'
        type: boolean

# Concurrency: Aynı anda sadece 1 çalışsın
concurrency:
  group: sync-matches
  cancel-in-progress: false

jobs:
  match-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate backend path
        run: |
          test -d .
          test -f run.py
          test -f requirements.txt

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate config import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -c "from config import Config; print('✅ Config OK')"

      - name: Sync matches + predict + extract stats
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # --limit 100 = PandaScore sayfa üst sınırı. 50'de kalınca 7 günlük pencerede
        # CS2 (152 maç) ve LoL (93) kırpılıyordu → maçlar ancak zamanla listenin
        # başına kaydıkça giriyordu. 100 bu gecikmeyi büyük ölçüde kapatır.
        run: python run.py --all-games --limit 100 --predict --stats

      - name: Generate AI news articles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run.py --generate-news --news-hours 2

      # ── Dead-man's switch (Gemini #54, 2026-08-28) ────────────────────────
      # Liquipedia hattı 8+ gün sessizce ölü kaldı. Sebep: koşular zaman
      # aşımından "cancelled" bitiyordu; GitHub'ın varsayılan hata e-postası ise
      # YALNIZCA "failure"da gider, "cancelled"da GİTMEZ. Eski "Notify on
      # failure" adımları da sadece log'a echo yapıyordu, hiçbir yere bildirim
      # gitmiyordu.
      #
      # Bu adım hem failure hem cancelled durumunda Resend ile alarm basar.
      # Alıcı iletisim@fextesports.com (Cloudflare Email Routing ile kurucunun
      # gelen kutusuna düşer) — public repo olduğu için kişisel adres yazılmadı.
      - name: "ETL alarmi (Resend)"
        if: ${{ failure() || cancelled() }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WF_NAME: ${{ github.workflow }}
          JOB_ID: "match-sync"
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY secret'i tanimli degil - alarm gonderilemedi."
            exit 0
          fi
          SUBJECT="[feXt ETL Alarm] $WF_NAME / $JOB_ID -> $JOB_STATUS"
          BODY="$WF_NAME is akisinda '$JOB_ID' isi $JOB_STATUS durumuyla bitti. Loglar: $RUN_URL -- 'cancelled' genellikle is zaman asimi demektir ve sonraki adimlarin atlandigi anlamina gelir."
          jq -n --arg s "$SUBJECT" --arg b "$BODY" \
            '{from:"feXt ETL <noreply@fextesports.com>",to:["iletisim@fextesports.com"],subject:$s,text:$b}' \
            > /tmp/alert.json
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/alert.json
          echo
  roster-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate backend path
        run: |
          test -d .
          test -f run.py
          test -f requirements.txt

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate config import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -c "from config import Config; print('✅ Config OK')"

      - name: Sync active player rosters (incremental, son 90 gün)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Bu iş SAATLİK çalışıyor. force'suz mod yalnızca HİÇ oyuncusu olmayan
        # takımları çeker → kadrosu bir kez yüklenen takım bir daha asla
        # tazelenmiyordu ve "kadro dışı oyuncuyu serbest bırak" (flush) mantığı
        # hiç devreye girmiyordu. Sonuç: FUT/BBL gibi takımlarda 6 ay bayat,
        # ayrılmış oyuncuları da içeren şişkin kadrolar.
        #
        # Çözüm: saatlik turlarda ucuz "eksik kadro" taraması sürsün; günde BİR
        # KEZ (03:00 UTC) son 7 günde maçı olan takımlar için tam tazeleme yap.
        # Böylece sitede görünen her takım en geç 24 saatte güncellenir ve
        # PandaScore istek bütçesi saatlik force ile patlamaz.
        run: |
          if [ "${{ github.event.inputs.force_rosters }}" = "true" ] || [ "$(date -u +%H)" = "03" ]; then
            echo "🔄 Günlük tam kadro tazeleme (son 7 gün, force)"
            python run.py --players --roster-days 7 --roster-force
          else
            echo "➕ Eksik kadro taraması (force yok)"
            python run.py --players --roster-days 90
          fi

      # ── Dead-man's switch (Gemini #54, 2026-08-28) ────────────────────────
      # Liquipedia hattı 8+ gün sessizce ölü kaldı. Sebep: koşular zaman
      # aşımından "cancelled" bitiyordu; GitHub'ın varsayılan hata e-postası ise
      # YALNIZCA "failure"da gider, "cancelled"da GİTMEZ. Eski "Notify on
      # failure" adımları da sadece log'a echo yapıyordu, hiçbir yere bildirim
      # gitmiyordu.
      #
      # Bu adım hem failure hem cancelled durumunda Resend ile alarm basar.
      # Alıcı iletisim@fextesports.com (Cloudflare Email Routing ile kurucunun
      # gelen kutusuna düşer) — public repo olduğu için kişisel adres yazılmadı.
      - name: "ETL alarmi (Resend)"
        if: ${{ failure() || cancelled() }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WF_NAME: ${{ github.workflow }}
          JOB_ID: "roster-sync"
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY secret'i tanimli degil - alarm gonderilemedi."
            exit 0
          fi
          SUBJECT="[feXt ETL Alarm] $WF_NAME / $JOB_ID -> $JOB_STATUS"
          BODY="$WF_NAME is akisinda '$JOB_ID' isi $JOB_STATUS durumuyla bitti. Loglar: $RUN_URL -- 'cancelled' genellikle is zaman asimi demektir ve sonraki adimlarin atlandigi anlamina gelir."
          jq -n --arg s "$SUBJECT" --arg b "$BODY" \
            '{from:"feXt ETL <noreply@fextesports.com>",to:["iletisim@fextesports.com"],subject:$s,text:$b}' \
            > /tmp/alert.json
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/alert.json
          echo
