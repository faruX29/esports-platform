name: Haftalik yedek (sifreli)

# Supabase ucretsiz planda yedek yok. Haftada bir public semasi (sema + veri) ve
# hesap kimlikleri (sifre hash'i HARIC) alinir, age ile sifrelenir ve ayri bir
# PRIVATE repoya Release olarak yuklenir (son 12 hafta tutulur).
# Ayni koşuda yedek bos bir Postgres 17'ye geri yuklenip satir sayilari canliyla
# karsilastirilir: her hafta geri yukleme de denenmis olur.
#
# Gerekenler:
#   secrets.YEDEK_AGE_ALICI   age acik anahtari (age1...). Gizli anahtar kurucuda,
#                             GitHub'da YOK; yedegi yalniz o acar.
#   secrets.YEDEK_REPO_TOKEN  yalniz yedek reposuna "Contents: write" yetkili token.
#   Yedek reposu: <sahip>/fext-yedek (private, en az bir commit'i olmali).
#
# Geri yukleme (elle): age -d -i anahtar.txt dosya.age | tar -xz
#   -> public.dump: pg_restore --no-owner --no-privileges -d <hedef> public.dump
#   -> auth_users.csv, cron_isler.csv: hesaplari ve pg_cron islerini yeniden kurmak icin.
#
# Repo PUBLIC, loglar herkese acik: satir sayisi ve veri loga basilmaz.
on:
  schedule:
    # Pazar 04:00 TSI (trafik en dusuk).
    - cron: '0 1 * * 0'
  workflow_dispatch:

concurrency:
  group: yedek
  cancel-in-progress: false

jobs:
  yedek:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # Geri yukleme denemesi icin bos veritabani (yalniz bu koşuda yasar).
      deneme:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: deneme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      HEDEF_DB_URL: postgresql://postgres:deneme@localhost:5432/postgres
      YEDEK_REPO: ${{ github.repository_owner }}/fext-yedek

    steps:
      - name: Gerekli secret'lar var mi
        timeout-minutes: 1
        env:
          YEDEK_AGE_ALICI: ${{ secrets.YEDEK_AGE_ALICI }}
          YEDEK_REPO_TOKEN: ${{ secrets.YEDEK_REPO_TOKEN }}
        run: |
          eksik=""
          [ -z "$YEDEK_AGE_ALICI" ] && eksik="$eksik YEDEK_AGE_ALICI"
          [ -z "$YEDEK_REPO_TOKEN" ] && eksik="$eksik YEDEK_REPO_TOKEN"
          if [ -n "$eksik" ]; then
            echo "::error::Eksik secret:$eksik"
            exit 1
          fi
          case "$YEDEK_AGE_ALICI" in age1*) ;; *) echo "::error::YEDEK_AGE_ALICI age1 ile baslamiyor (gizli anahtar mi girildi?)"; exit 1;; esac

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Bagimliliklar (Python, pg_dump 17, age)
        timeout-minutes: 6
        run: |
          pip install -r backend/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dokum al
        timeout-minutes: 8
        id: dokum
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          AD="fext-yedek-$(date -u +%Y-%m-%d-%H%M)"
          D="$RUNNER_TEMP/$AD"
          mkdir -p "$D"
          pg_dump --version
          # login_rpc_attempts (IP) ve client_errors kisa omurlu: yalniz semalari alinir.
          pg_dump "$DATABASE_URL" -Fc -n public -n canli --no-owner --no-privileges \
            --exclude-table-data=public.login_rpc_attempts \
            --exclude-table-data=public.client_errors \
            --exclude-table-data=canli.istek \
            -f "$D/public.dump"
          python backend/isletim/yedek.py disa-aktar "$D"
          echo "ad=$AD" >> "$GITHUB_OUTPUT"
          echo "klasor=$D" >> "$GITHUB_OUTPUT"
          ls "$D"

      - name: Geri yukleme denemesi
        timeout-minutes: 6
        id: geri
        run: |
          D="${{ steps.dokum.outputs.klasor }}"
          # Supabase'in hazir verdigi roller, auth semasi ve eklentiler; FK'ler icin hesap id'leri.
          psql "$HEDEF_DB_URL" -q -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin; create role authenticated nologin; create role service_role nologin;
          create schema auth; create schema extensions;
          create function auth.uid() returns uuid language sql stable as 'select null::uuid';
          create function auth.role() returns text language sql stable as 'select null::text';
          create function auth.jwt() returns jsonb language sql stable as 'select null::jsonb';
          create table auth.users (id uuid primary key, email text, email_confirmed_at timestamptz,
                                   created_at timestamptz, provider text, providers jsonb);
          create extension pg_trgm schema public;
          create extension pgcrypto schema extensions;
          create extension "uuid-ossp" schema extensions;
          SQL
          psql "$HEDEF_DB_URL" -q -v ON_ERROR_STOP=1 \
            -c "\copy auth.users from '$D/auth_users.csv' with (format csv, header true)"
          set +e
          pg_restore --no-owner --no-privileges --no-publications --no-subscriptions \
            -d "$HEDEF_DB_URL" "$D/public.dump" 2> "$D/geri_yukleme.log"
          set -e
          # Hata satirlari nesne adi tasir, veri tasimaz; DETAIL satirlari (veri olabilir) basilmaz.
          HATA=$(grep -c 'ERROR:' "$D/geri_yukleme.log" || true)
          echo "pg_restore sema hatasi: $HATA (ayrinti sifreli arsivde: geri_yukleme.log)"
          grep 'ERROR:' "$D/geri_yukleme.log" | sed 's/.*ERROR: *//' | cut -c1-160 | sort | uniq -c | head -20 || true
          python backend/isletim/yedek.py dogrula "$D"

      # Dogrulama bozuk ciksa da yedek yuklenir (eksik yedek hic yoktan iyi); is yine kirmizi biter.
      - name: Sifrele ve yedek reposuna yukle
        if: ${{ !cancelled() && steps.dokum.outcome == 'success' }}
        timeout-minutes: 5
        env:
          YEDEK_AGE_ALICI: ${{ secrets.YEDEK_AGE_ALICI }}
          GH_TOKEN: ${{ secrets.YEDEK_REPO_TOKEN }}
        run: |
          AD="${{ steps.dokum.outputs.ad }}"
          DOSYA="$RUNNER_TEMP/$AD.tar.gz.age"
          tar -czf - -C "$RUNNER_TEMP" "$AD" | age -r "$YEDEK_AGE_ALICI" -o "$DOSYA"
          rm -rf "$RUNNER_TEMP/$AD"
          NOT="Haftalik yedek. Dogrulama: ${{ steps.geri.outcome }}. Calisma: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh release create "$AD" "$DOSYA" --repo "$YEDEK_REPO" --title "$AD" --notes "$NOT"
          echo "yuklendi: $AD"

      - name: Eski yedekleri sil (son 12 kalir)
        if: ${{ !cancelled() && steps.dokum.outcome == 'success' }}
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.YEDEK_REPO_TOKEN }}
        run: |
          gh release list --repo "$YEDEK_REPO" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[12:] | .[].tagName' |
          while read -r TAG; do
            [ -n "$TAG" ] || continue
            echo "siliniyor: $TAG"
            gh release delete "$TAG" --repo "$YEDEK_REPO" --yes --cleanup-tag
          done

      - name: "ETL alarmi (Resend)"
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 2
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WF_NAME: ${{ github.workflow }}
          JOB_ID: "yedek"
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY secret'i tanimli degil - alarm gonderilemedi."
            exit 0
          fi
          SUBJECT="[feXt ETL Alarm] $WF_NAME / $JOB_ID -> $JOB_STATUS"
          BODY="$WF_NAME is akisinda '$JOB_ID' isi $JOB_STATUS durumuyla bitti. Loglar: $RUN_URL"
          jq -n --arg s "$SUBJECT" --arg b "$BODY" \
            '{from:"feXt ETL <noreply@fextesports.com>",to:["iletisim@fextesports.com"],subject:$s,text:$b}' \
            > /tmp/alert.json
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" -d @/tmp/alert.json
          echo
